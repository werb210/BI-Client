plugins {
    id 'com.android.application'
    // BI_CLIENT_ANDROID_FCM_v1
    // @capacitor/push-notifications resolves to FCM on Android and needs this
    // plugin to read google-services.json and produce a registration token.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.boreal.risk.client'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.boreal.risk.client'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { debuggable false; minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation project(':capacitor-android')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
}
apply from: 'capacitor.build.gradle'
