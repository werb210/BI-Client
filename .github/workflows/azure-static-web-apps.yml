name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Gated before build, deliberately: bf-client accumulated 145 test files
      # that no workflow ever ran. A red suite must block the deploy.
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Verify SWA config reached the artifact
        run: |
          if [ ! -f dist/staticwebapp.config.json ]; then
            echo "::error::dist/staticwebapp.config.json missing - hard reloads will 404."
            exit 1
          fi
          echo "staticwebapp.config.json present in dist/"
      - name: Deploy
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # BI_CLIENT_SWA_APP_LOCATION_v2 - with skip_app_build the action uploads
          # app_location verbatim and IGNORES the output location. app_location "/"
          # therefore shipped the repo root, so Azure served the SOURCE index.html
          # whose only script tag is /src/main.tsx. That path does not exist in a
          # production upload, navigationFallback rewrote it to index.html, the
          # browser refused text/html as a module, and the page rendered blank
          # with a correct . Point at the built output instead.
          app_location: "dist"
          skip_app_build: true
