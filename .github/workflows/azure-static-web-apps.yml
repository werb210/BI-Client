name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Gated before build, deliberately: bf-client accumulated 145 test files
      # that no workflow ever ran. A red suite must block the deploy.
      - name: Test
        run: npm run test:ci
      - name: Build
        run: npm run build
      - name: Verify SWA config reached the artifact
        run: |
          if [ ! -f dist/staticwebapp.config.json ]; then
            echo "::error::dist/staticwebapp.config.json missing - hard reloads will 404."
            exit 1
          fi
          echo "staticwebapp.config.json present in dist/"
      - name: Deploy
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
          skip_app_build: true
