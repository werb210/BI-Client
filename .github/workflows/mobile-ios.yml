name: Mobile iOS verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install macOS native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(node -p 'process.arch')"

          case "$ARCH" in
            arm64|x64)
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: $ARCH"
              exit 1
              ;;
          esac

          npm install \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            "@rollup/rollup-darwin-${ARCH}@4.62.4" \
            "@esbuild/darwin-${ARCH}@0.21.5"
      - name: Verify macOS native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const arch = process.arch;

          if (!["arm64", "x64"].includes(arch)) {
            throw new Error(`Unsupported macOS CI architecture: ${arch}`);
          }

          const rollupPackage = `@rollup/rollup-darwin-${arch}`;

          console.log(`Runner architecture: ${arch}`);

          const rollupPath = require.resolve(rollupPackage);
          console.log(`Rollup native module: ${rollupPath}`);

          const esbuildBinary = path.join(
            process.cwd(),
            "node_modules",
            "@esbuild",
            `darwin-${arch}`,
            "bin",
            "esbuild"
          );

          if (!fs.existsSync(esbuildBinary)) {
            throw new Error(
              `Esbuild native binary missing: ${esbuildBinary}`
            );
          }

          const stat = fs.statSync(esbuildBinary);

          if (!stat.isFile()) {
            throw new Error(
              `Esbuild native binary is not a file: ${esbuildBinary}`
            );
          }

          console.log(`Esbuild native binary: ${esbuildBinary}`);
          NODE
      - name: Verify Esbuild native binary executes
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(node -p 'process.arch')"

          ESBUILD_BINARY="node_modules/@esbuild/darwin-${ARCH}/bin/esbuild"

          test -f "$ESBUILD_BINARY"

          chmod +x "$ESBUILD_BINARY"

          "$ESBUILD_BINARY" --version
      - name: Verify native install did not alter manifests
        run: |
          git diff --exit-code -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Verify web output
        run: |
          test -f dist/index.html
      - run: npx cap sync ios
      - name: Inspect generated Capacitor Swift package
        run: cat ios/App/CapApp-SPM/Package.swift
      - name: Verify iOS release guardrails after Capacitor sync
        run: node scripts/verify-ios-config.mjs
      - name: Resolve Swift Package Manager dependencies
        run: |
          swift package resolve \
            --package-path ios/App/CapApp-SPM
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
