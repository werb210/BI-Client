name: Mobile iOS verification
on:
  pull_request:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install macOS native build dependencies
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(node -p 'process.arch')"

          case "$ARCH" in
            arm64|x64)
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: $ARCH"
              exit 1
              ;;
          esac

          npm install \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            "@rollup/rollup-darwin-${ARCH}@4.62.4" \
            "@esbuild/darwin-${ARCH}@0.21.5"
      - name: Verify macOS native build dependencies
        run: |
          node <<'NODE'
          const arch = process.arch;

          if (!["arm64", "x64"].includes(arch)) {
            throw new Error(`Unsupported macOS CI architecture: ${arch}`);
          }

          const rollup = `@rollup/rollup-darwin-${arch}`;
          const esbuild = `@esbuild/darwin-${arch}`;

          console.log(`Runner architecture: ${arch}`);
          console.log(require.resolve(rollup));
          console.log(require.resolve(esbuild));
          NODE
      - name: Verify native install did not alter manifests
        run: |
          git diff --exit-code -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Verify web output and iOS release guardrails
        run: |
          test -f dist/index.html
          node scripts/verify-ios-config.mjs
      - run: npx cap sync ios
      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
